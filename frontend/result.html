<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeafGuard - Result</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="container small">
      <header class="header">
        <h1>Prediction Result</h1>
      </header>

      <main class="card result-card">
        <p><strong>Disease:</strong> <span id="resultDisease">Waiting for prediction...</span></p>
        <p><strong>Confidence:</strong> <span id="resultConfidence">-</span></p>
        <p><strong>What it is:</strong> <span id="resultDescription">-</span></p>
        <p><strong>Solution:</strong> <span id="resultSolution">-</span></p>
        <a href="/" class="link-btn">Back to upload</a>
      </main>
    </div>

    <script src="/static/js/script.js"></script>
  </body>
</html>
